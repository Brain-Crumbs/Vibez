name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# A newer push on the same PR/branch supersedes an in-flight run rather than
# queuing behind it; PR merge-readiness (BOOT-024/BOOT-025) must always read
# the status of the exact current head, never a stale queued run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Node)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On a pull_request event, actions/checkout's default ref checks out
          # the synthetic merge commit rather than the PR's actual head commit.
          # Check out the exact head SHA instead, so results are bound to the
          # exact revision a merge-readiness reader (BOOT-024/BOOT-025) and a
          # reviewer both mean by "this PR" (github.sha still applies as-is
          # for push/workflow_dispatch, where there is no pull_request head).
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history (not the default shallow single-ref checkout) so that
          # `git merge-base main`/`origin/main` resolves. The repository's own
          # architecture-review/qa-review context-source tests run git diff
          # against the base branch using the real checked-out repository
          # (tests/architecture-review.test.mjs, tests/qa-review.test.mjs) and
          # fail with "Cannot resolve a merge base" under a shallow checkout.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Python for test fixtures
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema-validation dependencies
        run: python -m pip install -r schemas/requirements.txt

      - name: Build (tsc)
        run: npm run build

      - name: Test (node --test)
        run: npm test

      - name: Mutation-check adversarial workflow guards
        run: npm run test:adversarial:mutations

  schema-validation:
    name: Schema and contract validation (Python)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # See build-and-test's checkout step: check out the PR's actual head
          # commit rather than the pull_request event's default synthetic
          # merge-commit ref, so this job's result is bound to the exact same
          # revision as build-and-test's.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install schema-validation dependencies
        run: python -m pip install -r schemas/requirements.txt

      - name: Validate schema fixtures
        run: python schemas/validate_fixtures.py

      - name: Validate real repository contract/task records
        run: python schemas/validate_repository_contracts.py

      - name: Validate design and provenance guards
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Verify the recorded seed
        run: python scripts/seed_export.py

      - name: Verify the seed PR tree
        if: github.event_name == 'pull_request' && github.head_ref == 'migration/mig-003-provenance-extraction'
        run: python scripts/seed_export.py --check-head

  windows-seed:
    name: Seed validation (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build and schema tools
        run: |
          npm ci
          python -m pip install -r schemas/requirements.txt

      - name: Build and run the full suite
        run: npm test

      - name: Validate schemas and seed provenance
        run: |
          python schemas/validate_fixtures.py
          python schemas/validate_repository_contracts.py
          python scripts/seed_export.py

  installed-candidate:
    name: Pack exact candidate and record digests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pack:candidate -- "${{ runner.temp }}/vibez candidate"
      - uses: actions/upload-artifact@v4
        with:
          name: vibez-candidate-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/vibez candidate/candidate.json
          if-no-files-found: error

  installed-consumer:
    name: Installed consumer (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: installed-candidate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run pack:candidate -- "${{ runner.temp }}/vibez candidate"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: vibez-candidate-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/reference receipt
      - name: Verify reproducible candidate bytes
        run: >-
          node -e "const fs = require('node:fs');
          const [first, second] = process.argv.slice(1).map(path => JSON.parse(fs.readFileSync(path)));
          for (const key of ['sourceCommit', 'package', 'version', 'sha256', 'integrity'])
          require('node:assert/strict').equal(first[key], second[key], key)"
          "${{ runner.temp }}/vibez candidate/candidate.json"
          "${{ runner.temp }}/reference receipt/candidate.json"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm run test:conformance -- "${{ runner.temp }}/vibez candidate"
