name: Design contracts
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: design-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  design:
    name: Design contracts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: design
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Brain-Crumbs/IPTFantasyFootball
          ref: 50ef51e7dd2443dd0cec644c04e8db1b7fd612f7
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Brain-Crumbs/IPTFantasyFootball
          ref: fbc46888ce0bd2af454f471561911a913d32e6fc
          path: engine
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned engine toolchain
        working-directory: engine
        run: npm ci
      - name: Build pinned registry tooling
        working-directory: engine
        run: npm run build
      - name: Install schema checker
        run: python -m pip install -r engine/schemas/requirements.txt
      - name: Audit exact source and staged design
        run: python design/scripts/check_design.py --source source --engine engine
      - name: Negative specification checks
        working-directory: design
        run: python -m unittest discover -s tests -p "test_*.py"
